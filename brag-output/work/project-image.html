<!doctype html>
<!-- Project image, 3:2 at 1500x1000. Render with ./render-project-image.sh -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Inter"; src: url(composition/assets/fonts/Inter-normal.woff2) format("woff2"); font-weight: 100 900; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1500px; height: 1000px; overflow: hidden; background: #0b1020; }
body { position: relative; font-family: "Inter", sans-serif; }
.room { position: absolute; inset: 0; background: url(composition/assets/bg/winterNight.jpg) center / cover; filter: brightness(.82); }
/* soft ambient light the screen throws onto the wall */
.spill { position: absolute; left: 50%; top: 430px; width: 1240px; height: 760px; margin: -380px 0 0 -620px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(130,170,240,.34), rgba(130,170,240,0)); }
.floor { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,11,24,.2) 0%, rgba(8,11,24,0) 25%, rgba(8,11,24,0) 72%, rgba(8,11,24,.35) 100%); }
/* wall-mounted TV, 16:9 */
.tv { position: absolute; left: 50%; top: 420px; width: 880px; height: 512px; margin: -256px 0 0 -440px; border-radius: 16px; padding: 10px;
  background: linear-gradient(180deg, #2a2c33 0%, #0e0f12 100%);
  box-shadow: 0 0 0 1px rgba(255,255,255,.1) inset, 0 1px 0 rgba(255,255,255,.18) inset, 0 0 0 1px rgba(0,0,0,.6), 0 0 90px rgba(110,150,230,.22), 0 40px 80px rgba(0,0,0,.55), 0 12px 28px rgba(0,0,0,.4); }
.screen { position: relative; width: 100%; height: 100%; border-radius: 6px; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: url(composition/assets/bg/springDay.jpg) 44% 51% / 165% auto; }
.screen .inner { position: relative; display: flex; flex-direction: column; align-items: center; margin-top: -8px; }
/* soft scrim behind the type so white reads on the light wall */
.screen::before { content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse 48% 40% at 50% 50%, rgba(16,40,64,.30), rgba(16,40,64,0) 100%); }
/* faint glass glare */
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(118deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.02) 38%, rgba(255,255,255,0) 39%); }
.logo { position: relative; width: 330px; display: block; filter: drop-shadow(0 4px 16px rgba(10,30,50,.45)); }
.line { position: relative; margin-top: 30px; text-align: center; font-weight: 500; font-size: 54px; line-height: 1.12; letter-spacing: .01em; color: #FFFFFF;
  text-shadow: 0 2px 14px rgba(10,30,50,.55), 0 1px 2px rgba(10,30,50,.35); white-space: nowrap; }
</style>
</head>
<body>
  <div class="room"></div>
  <div class="floor"></div>
  <div class="spill"></div>
  <div class="tv">
    <div class="screen">
      <div class="inner">
        <img class="logo" src="composition/assets/img/recco-logo.png" alt="Recco">
        <div class="line">Personal Inbox<br>for Fire TV</div>
      </div>
    </div>
  </div>
</body>
</html>
