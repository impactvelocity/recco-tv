<!doctype html>
<!-- YouTube thumbnail, 1280x720. Render with ./render-thumbnail.sh -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Inter"; src: url(composition/assets/fonts/Inter-normal.woff2) format("woff2"); font-weight: 100 900; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: #0b1020; }
.room { position: absolute; inset: 0; background: url(composition/assets/bg/winterNight.jpg) center / cover; filter: brightness(.55); }
.shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,11,24,.9) 0%, rgba(8,11,24,.75) 34%, rgba(8,11,24,.15) 56%, rgba(8,11,24,0) 72%); }
.glow { position: absolute; left: 520px; top: 40px; width: 900px; height: 640px; border-radius: 50%; background: radial-gradient(closest-side, rgba(240,182,103,.28), rgba(240,182,103,0)); }
/* the TV from the video's inbox frame (brag.jpg): bezel spans x 258-1662, y 128-927 of the 1920x1080 still */
.tv { --s: .641; position: absolute; left: 560px; top: 104px; width: calc(1404px * var(--s)); height: calc(799px * var(--s)); border-radius: 11px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.65); }
.tv img { position: absolute; width: calc(1920px * var(--s)); left: calc(-258px * var(--s)); top: calc(-128px * var(--s)); }
.copy { position: absolute; left: 56px; top: 86px; }
.logo { width: 176px; display: block; margin-bottom: 30px; filter: drop-shadow(0 4px 18px rgba(0,0,0,.5)); }
.line { font-family: "Inter", sans-serif; font-weight: 800; font-size: 90px; line-height: 1.0; letter-spacing: -.045em; color: #FFF6E8; text-shadow: 0 6px 30px rgba(0,0,0,.55); white-space: nowrap; }
.line.accent { color: #F0B667; }
.sms { position: absolute; left: 56px; top: 466px; background: #1A7A33; color: #fff; font-family: "Inter", sans-serif; font-size: 31px; font-weight: 600; line-height: 1.22; letter-spacing: -.01em; padding: 18px 26px; border-radius: 30px 30px 8px 30px; width: 430px; box-shadow: 0 18px 44px rgba(0,0,0,.5); transform: rotate(-3deg); }
</style>
</head>
<body>
  <div class="room"></div>
  <div class="glow"></div>
  <div class="shade"></div>
  <div class="tv"><img src="../brag.jpg" alt=""></div>
  <div class="copy">
    <img class="logo" src="composition/assets/img/recco-logo.png" alt="Recco">
    <div class="line">Text a show</div>
    <div class="line accent">to your TV</div>
  </div>
  <div class="sms">Two-Car Garage - Jill says it's hilarious</div>
</body>
</html>
