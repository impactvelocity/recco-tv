<!doctype html>
<!-- Project image (corner variant), 3:2 at 1500x1000. Render with ./render-project-image.sh project-image-corner -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Inter"; src: url(composition/assets/fonts/Inter-normal.woff2) format("woff2"); font-weight: 100 900; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1500px; height: 1000px; overflow: hidden; background: #0b1020; }
body { position: relative; font-family: "Inter", sans-serif; }
.room { position: absolute; inset: 0; background: url(composition/assets/bg/winterNight.jpg) 30% center / cover; filter: brightness(.7); }
.shade { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(8,11,24,.35) 0%, rgba(8,11,24,0) 40%); }
.spill { position: absolute; left: 800px; top: 560px; width: 1900px; height: 1400px; margin: -700px 0 0 -950px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(130,170,240,.28), rgba(130,170,240,0)); }
/* TV running off the bottom-right edge; screen shows the top-left corner of the inbox (brag.jpg, screen starts at 270,140) */
.tv { position: absolute; left: 104px; top: 104px; width: 1500px; height: 1000px; padding: 12px; border-radius: 20px;
  background: linear-gradient(180deg, #2a2c33 0%, #0e0f12 100%);
  box-shadow: 0 0 0 1px rgba(255,255,255,.1) inset, 0 1px 0 rgba(255,255,255,.18) inset, 0 0 0 1px rgba(0,0,0,.6), 0 0 120px rgba(110,150,230,.25), 0 40px 90px rgba(0,0,0,.6); }
.screen { position: relative; width: 100%; height: 100%; border-radius: 9px; overflow: hidden; background: #101830; }
.screen img { position: absolute; width: calc(1920px * 1.5); left: calc(-270px * 1.5); top: calc(-140px * 1.5); }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(118deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.02) 30%, rgba(255,255,255,0) 31%); }
</style>
</head>
<body>
  <div class="room"></div>
  <div class="shade"></div>
  <div class="spill"></div>
  <div class="tv"><div class="screen"><img src="../brag.jpg" alt=""></div></div>
</body>
</html>
